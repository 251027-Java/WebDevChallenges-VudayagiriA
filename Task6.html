<!DOCTYPE html>
<html>
    <head>
        <title>JS Input Example</title>
    </head>
    <body>
        <h2>Enter your name:</h2>
        <input type="text" id="nameInput" placeholder="Your name here">
        <button onclick="greetUser()">Greet Me</button>
        <script>
            function greetUser() {
                let name = document.getElementById("nameInput").value;
                alert("Hello, " + name + "!");

            }
        </script>
    </body>
</html>
