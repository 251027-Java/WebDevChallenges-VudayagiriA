<!DOCTYPE html>
<html>
<head>
    <title>Task 13 - Style Switcher</title>
</head>
<body>

    <p id="myParagraph">This is my paragraph text.</p>

    <button onclick="makeRedAndBold()">Make Red & Bold</button>
    <button onclick="resetStyle()">Reset</button>

    <script>
        function makeRedAndBold() {
            const p = document.getElementById("myParagraph");
            p.style.color = "red";
            p.style.fontWeight = "bold";
        }

        function resetStyle() {
            const p = document.getElementById("myParagraph");
            p.style.color = "black";
            p.style.fontWeight = "normal";
        }
    </script>

</body>
</html>
