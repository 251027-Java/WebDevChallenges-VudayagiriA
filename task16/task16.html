<!DOCTYPE html>
<html>
<head>
    <title>Task 16 - Color Changer</title>
</head>
<body>

    <button id="colorBtn">Change Background Color</button>

    <script>
        let colors = ["lightblue", "lightgreen", "lightpink", "lightyellow", "lavender"];
        let index = 0;

        document.getElementById("colorBtn").addEventListener("click", function() {
            document.body.style.backgroundColor = colors[index];

            // Move to next color
            index++;

            // When we reach the end, start back at 0
            if (index >= colors.length) {
                index = 0;
            }
        });
    </script>

</body>
</html>
